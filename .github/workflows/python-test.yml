name: Data Analysis Scripts Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Check Scripts Syntax (Dry Run)
      run: |
        # 仅编译检查语法错误，不实际执行绘图（避免无显示器报错）
        python -m py_compile scripts/plot_bet.py
        python -m py_compile scripts/calc_particle_size.py
        python -m py_compile scripts/compare_isotherms.py
        python -m py_compile scripts/endnote_parser.py
        echo "✅ 所有 Python 脚本语法检查通过！"
